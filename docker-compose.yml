services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yersps
      POSTGRES_USER: yersps
      POSTGRES_PASSWORD: yersps
    ports:
      - '5432:5432'
    volumes:
      - yersps_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yersps -d yersps']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yersps_postgres:
